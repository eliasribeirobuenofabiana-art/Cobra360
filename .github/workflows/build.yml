name: build-cobra360
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo flex bison \
            libgmp-dev libmpfr-dev libmpc-dev libelf-dev libncurses5-dev \
            libpng-dev libfreetype6-dev zlib1g-dev wget

      - name: Preparar pasta
        run: |
          sudo mkdir -p /usr/local/xenon
          sudo chown -R $USER /usr/local/xenon

      - name: Restaurar cache da toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v2

      - name: Compilar toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          sudo ./build-xenon-toolchain toolchain

      - name: Salvar cache da toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v2

      - name: Clonar libxenon (se veio do cache)
        run: |
          [ -d libxenon ] || git clone https://github.com/Free60Project/libxenon.git

      - name: Compilar libxenon
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin
          cd libxenon/toolchain
          sudo -E env "PATH=$PATH" ./build-xenon-toolchain libxenon

      - name: Compilar o jogo
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin
          make

      - uses: actions/upload-artifact@v4
        with:
          name: cobra360
          path: |
            *.elf32
            *.elf
