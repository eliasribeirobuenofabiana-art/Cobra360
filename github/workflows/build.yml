name: build-cobra360
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo flex bison \
            libgmp-dev libmpfr-dev libmpc-dev libelf-dev libncurses5-dev \
            libpng-dev libfreetype6-dev zlib1g-dev wget

      - name: Cache da toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v1

      - name: Compilar toolchain + libxenon
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          # Confira no README do libxenon o nome exato do script
          sudo ./build-xenon-toolchain toolchain
          cd ..
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin
          sudo -E env "PATH=$PATH" ./build-xenon-toolchain libxenon || true
          sudo -E env "PATH=$PATH" make install

      - name: Compilar o jogo
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin
          make

      - uses: actions/upload-artifact@v4
        with:
          name: cobra360
          path: |
            *.elf32
            *.elf
